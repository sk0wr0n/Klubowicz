function doJoin() {
  const t = tr(S.tid); const st = main(t).length < t.limit ? 'main' : 'reserve';
  const ex = t.signups.find(s => s.uid === S.me);
  if (ex) { ex.status = st; ex.at = seq++; } else t.signups.push({ uid: S.me, status: st, car: false, beer: false, staff: false, at: seq++ });
  toast(st === 'main' ? 'Zapisano! Jesteś na liście głównej.' : 'Lista pełna – jesteś na liście rezerwowej.', st === 'main' ? 'ok' : 'info');
}
function promote(t) { const free = t.limit - main(t).length; const r = reserve(t).slice(0, Math.max(free, 0)); r.forEach(s => s.status = 'main'); return r; }
function doLeave(isLate) {
  const t = tr(S.tid); const s = t.signups.find(x => x.uid === S.me); const wasMain = s.status === 'main';
  if (isLate) { s.status = 'late'; s.car = s.beer = false; } else t.signups = t.signups.filter(x => x !== s);
  const promoted = wasMain ? promote(t) : [];
  toast((isLate ? 'Wypisano po terminie.' : 'Wypisano z treningu.') + (promoted.length ? ` ${mem(promoted[0].uid).name} awansuje z rezerwy!` : ''), 'info');
}
function settleCalc() {
  const t = tr(S.tid); const present = [...S.att.present];
  const payers = present.filter(u => mem(u).billing === 'per_session');
  const lateIds = late(t).map(s => s.uid).filter(u => S.att.late.has(u) && !S.att.present.has(u) && mem(u).billing === 'per_session');
  return { present, payers, lateIds, total: (payers.length + lateIds.length) * FEE };
}
function doSettle() {
  const t = tr(S.tid); const x = settleCalc(); const label = t.title + ' ' + fDate(t.start);
  x.payers.forEach(u => D.tx.push({ id: 'x' + (seq++), uid: u, amount: -FEE, type: 'session_fee', desc: label, date: t.start }));
  x.lateIds.forEach(u => D.tx.push({ id: 'x' + (seq++), uid: u, amount: -FEE, type: 'late_cancel_fee', desc: 'Późne wypisanie: ' + label, date: t.start }));
  x.present.forEach(u => { if (!t.signups.find(s => s.uid === u)) t.signups.push({ uid: u, status: 'main', car: false, beer: false, staff: true, at: seq++ }); });
  t.attendance = new Set(x.present); t.status = 'settled'; S.att = null;
  toast(`Obecność zapisana: ${x.present.length} osób`);
}
function norm(s) { return s.toLowerCase().replace(/ł/g, 'l').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, ' ').trim(); }
function match(r) {
  const hay = ' ' + norm(r.title + ' ' + r.sender) + ' ';
  const cm = (r.title + ' ' + r.sender).toLowerCase().match(/vca\s*[-_ ]?\s*0*(\d{1,3})/);
  const act = D.members.filter(m => m.status === 'active');
  if (cm) { const m = act.find(x => Number(x.code.slice(4)) === Number(cm[1])); if (m) return { uid: m.id, reason: 'kod' }; }
  const al = act.filter(m => m.aliases.some(a => hay.includes(' ' + norm(a) + ' '))); if (al.length === 1) return { uid: al[0].id, reason: 'alias' };
  const nm = act.filter(m => norm(m.name).split(' ').every(p => hay.includes(' ' + p + ' '))); if (nm.length === 1) return { uid: nm[0].id, reason: 'imię i nazwisko' };
  return null;
}

function calendar() {
  const m = S.month, first = new Date(m.getFullYear(), m.getMonth(), 1), off = (first.getDay() + 6) % 7, days = new Date(m.getFullYear(), m.getMonth() + 1, 0).getDate();
  const cells = []; for (let i = 0; i < off; i++) cells.push(null); for (let d = 1; d <= days; d++) cells.push(new Date(m.getFullYear(), m.getMonth(), d));
  const today = dayKey(new Date());
  const grid = cells.map(d => { if (!d) return '<div></div>'; const k = dayKey(d); const list = D.trainings.filter(t => dayKey(t.start) === k);
    const mine = list.some(t => t.signups.some(s => s.uid === S.me && s.status !== 'late')); const sel = S.day === k;

    ${top.length ? `<ol class="divide-y divide-slate-100">${top.map(x => { const me2 = x.m.id === S.me; const r = x['r_' + key]; return `<li class="flex items-center gap-3 py-2 ${me2 ? 'bg-indigo-50 rounded-xl px-2 -mx-2' : ''}"><span class="w-7 text-center text-sm font-bold text-slate-400">${['🥇', '🥈', '🥉'][r - 1] || r + '.'}</span>${avatar(x.m.name, 'w-8 h-8')}<span class="flex-1 truncate text-sm ${me2 ? 'font-semibold text-indigo-700' : 'font-medium'}">${x.m.name}${me2 ? ' (Ty)' : ''}</span><b class="text-sm">${fmt(x[key])}</b></li>`; }).join('')}</ol>` : `<p class="py-4 text-center text-sm text-slate-400">${empty}</p>`}
    ${mine && !inTop ? `<p class="mt-2 rounded-xl bg-slate-50 px-3 py-2 text-xs text-slate-600">Ty: <b>${mine['r_' + key]}. miejsce</b> · ${fmt(mine[key])}</p>` : ''}</div>`;
  };
  const me2 = st.find(x => x.m.id === S.me) || { visits: 0, cars: 0, beers: 0 };
  const times = v => v + '×';
  return `<h1 class="text-xl font-bold">Statystyki</h1><p class="text-sm text-slate-500 mb-3">Treningi ze sprawdzoną obecnością: ${done.length}</p>
  <div class="grid grid-cols-3 bg-slate-100 rounded-xl p-1 text-xs font-semibold mb-4">${[['month', 'Ten miesiąc'], ['year', 'Ten rok'], ['all', 'Od początku']].map(([v, l]) => `<button data-a="period" data-v="${v}" class="py-2 rounded-lg ${p === v ? 'bg-white shadow' : 'text-slate-500'}">${l}</button>`).join('')}</div>
  <div class="space-y-4"><div class="card bg-indigo-50 border-indigo-200"><h2 class="font-semibold text-indigo-800 mb-2">🏆 Twoje wyniki</h2><div class="grid grid-cols-3 gap-2 text-center">
   <div class="rounded-xl bg-white p-2"><p class="text-xl font-bold text-indigo-700">${me2.visits}</p><p class="text-[11px] text-slate-500">🏐 treningów</p></div>
   <div class="rounded-xl bg-white p-2"><p class="text-xl font-bold text-sky-700">${me2.cars}</p><p class="text-[11px] text-slate-500">🚗 autem</p></div>
   <div class="rounded-xl bg-white p-2"><p class="text-xl font-bold text-amber-600">${me2.beers}</p><p class="text-[11px] text-slate-500">🍺 integracji</p></div></div></div>
  ${board('🏐', 'Najwięcej treningów', 'visits', times, 'Brak treningów ze sprawdzoną obecnością w tym okresie.')}
  ${board('🚗', 'Najczęściej autem', 'cars', times, 'Nikt jeszcze nie przyjechał autem.')}
  ${board('🍺', 'Najczęściej na integracji', 'beers', times, 'Jeszcze nikt nie został na integracji.')}
  ${board('💰', 'Najwyższe saldo', 'balance', v => money(v), 'Nikt nie ma jeszcze nadpłaty.')}
  <p class="text-center text-xs text-slate-400">Liczą się treningi z zatwierdzoną obecnością. Ranking salda pokazuje tylko nadpłaty.</p></div>`;
}
function teamView() {
  const all = D.members.filter(m => m.status === 'active').map(m => ({ m, b: balance(m.id) }));
  const debt = all.filter(x => x.b < 0).length; const f = S.teamFilter || 'all';
  const list = all.filter(x => f === 'all' || x.b < 0).sort((a, c) => a.m.name.localeCompare(c.m.name, 'pl'));
  return `<h1 class="text-xl font-bold">Zespół</h1><p class="text-sm text-slate-500 mb-3">Członków: ${all.length} · do zapłaty ma ${debt} os.</p>
  <div class="flex gap-2 mb-3"><button data-a="teamFilter" data-v="all" class="btn py-1.5 px-3 text-xs ${f === 'all' ? 'bg-indigo-600 text-white' : 'bg-white border border-slate-200'}">Wszyscy</button><button data-a="teamFilter" data-v="debt" class="btn py-1.5 px-3 text-xs ${f === 'debt' ? 'bg-indigo-600 text-white' : 'bg-white border border-slate-200'}">Do zapłaty (${debt})</button></div>
  <div class="card p-0 fade"><ul class="divide-y divide-slate-100">${list.map(({ m, b }) => `<li><button data-a="history" data-id="${m.id}" class="w-full flex items-center gap-3 px-4 py-3 text-left">${avatar(m.name)}<div class="flex-1 min-w-0"><p class="text-sm font-medium truncate">${m.name} <span class="text-xs text-slate-400">${m.code}</span></p>
   <div class="flex gap-1 mt-0.5"><span class="chip ${m.billing === 'monthly' ? 'bg-violet-100 text-violet-700' : 'bg-slate-100 text-slate-600'}">${m.billing === 'monthly' ? 'abonament' : 'za trening'}</span>${m.role !== 'member' ? `<span class="chip bg-sky-100 text-sky-700">${m.role === 'owner' ? 'Właściciel' : 'Opiekun'}</span>` : ''}</div></div>
   <div class="text-right"><b class="text-sm ${b < 0 ? 'text-red-600' : 'text-emerald-600'}">${money(b)}</b><p class="text-[10px] text-slate-400">${b < 0 ? 'do zapłaty' : b > 0 ? 'nadpłata' : 'rozliczony'}</p></div></button></li>`).join('')}</ul></div>
  <p class="text-xs text-slate-400 text-center mt-3">Kliknij osobę, aby zobaczyć historię wpłat i obciążeń.</p>`;
}
function modal() {
  const md = S.modal; if (!md) return '';
  let inner;
  if (md.history) {
    const m = mem(md.history), b = balance(m.id); let run = 0;
    const rows = D.tx.filter(x => x.uid === m.id).sort((a, c) => a.date - c.date).map(x => { run += x.amount; return { x, run }; }).reverse();
    inner = `<h2 class="font-semibold">${m.name}</h2><p class="text-xs text-slate-500 mb-3">${m.code} · ${m.billing === 'monthly' ? 'abonament miesięczny' : 'płatność za trening'}</p>
    <div class="rounded-xl p-3 text-center mb-2 ${b < 0 ? 'bg-red-50' : 'bg-emerald-50'}"><p class="text-2xl font-bold ${b < 0 ? 'text-red-600' : 'text-emerald-600'}">${money(b)}</p><p class="text-xs text-slate-500">saldo</p></div>
    <ul class="divide-y divide-slate-100 max-h-[45vh] overflow-y-auto">${rows.map(({ x, run }) => `<li class="flex justify-between py-2.5 gap-3"><div class="min-w-0"><p class="text-sm truncate">${x.desc}</p><p class="text-xs text-slate-500">${fDate(x.date)}</p></div><div class="text-right"><p class="text-sm font-semibold ${x.amount > 0 ? 'text-emerald-600' : 'text-red-600'}">${x.amount > 0 ? '+' : ''}${money(x.amount)}</p><p class="text-[10px] text-slate-400">saldo ${money(run)}</p></div></li>`).join('') || '<li class="py-4 text-center text-sm text-slate-400">Brak operacji</li>'}</ul>
    <button data-a="closeModal" class="btn w-full mt-3 bg-white border border-slate-200">Zamknij</button>`;
  } else if (md.picker) {
    const t = tr(S.tid); const taken = new Set(t.signups.filter(s => s.status !== 'late').map(s => s.uid));
    const list = D.members.filter(m => m.status === 'active' && !taken.has(m.id));
    inner = `<h2 class="font-semibold mb-3">${md.picker === 'att' ? 'Dodaj obecną osobę (niezapisaną w apce)' : 'Dopisz osobę do treningu'}</h2><ul class="divide-y divide-slate-100 max-h-[50vh] overflow-y-auto">${list.map(m => `<li><button data-a="add" data-id="${m.id}" class="w-full flex items-center gap-3 py-2.5 text-left">${avatar(m.name, 'w-8 h-8')}<span class="flex-1"><span class="block text-sm font-medium">${m.name}</span><span class="text-xs text-slate-500">${m.code} · ${m.billing === 'monthly' ? 'abonament' : 'za trening'}</span></span><span class="text-indigo-600 font-bold">+</span></button></li>`).join('') || '<li class="py-6 text-center text-sm text-slate-400">Wszyscy są już na liście</li>'}</ul>
    <button data-a="closeModal" class="btn w-full mt-3 bg-white border border-slate-200">Zamknij</button>`;
  } else if (md.form === 'training') {
    const d = new Date(); d.setDate(d.getDate() + 7);
    const iso = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    const inp = 'w-full rounded-xl border border-slate-200 px-3 py-2.5 text-base';
    inner = `<h2 class="font-semibold mb-3">Nowy trening</h2><div class="grid grid-cols-2 gap-3">
    <div class="col-span-2"><span class="label">Nazwa</span><input id="f-title" class="${inp}" value="Trening siatkówki"></div>
    <div><span class="label">Data</span><input id="f-date" type="date" class="${inp}" value="${iso}"></div><div><span class="label">Godzina</span><input id="f-time" type="time" class="${inp}" value="19:00"></div>
    <div><span class="label">Limit miejsc</span><input id="f-limit" type="number" class="${inp}" value="14"></div><div><span class="label">Powtórz co tydzień</span><select id="f-rep" class="${inp}"><option value="1">tylko raz</option><option value="4">4 tygodnie</option><option value="8">8 tygodni</option></select></div></div>
    <div class="flex gap-2 mt-4"><button data-a="closeModal" class="btn flex-1 bg-white border border-slate-200">Anuluj</button><button data-a="saveTraining" class="btn flex-1 bg-indigo-600 text-white">Zapisz</button></div>`;
  } else {
    inner = `<h2 class="font-semibold mb-2">${md.title}</h2><div class="text-sm text-slate-700 leading-relaxed">${md.body}</div>
    <div class="flex gap-2 mt-5"><button data-a="closeModal" class="btn flex-1 bg-white border border-slate-200">Anuluj</button><button data-a="confirm" class="btn flex-1 text-white ${md.danger ? 'bg-red-600' : 'bg-indigo-600'}">${md.ok}</button></div>`;
  }
  return `<div class="fixed inset-0 z-50 flex items-end sm:items-center justify-center"><div data-a="closeModal" class="absolute inset-0 bg-slate-900/50"></div><div class="relative w-full max-w-[430px] bg-white rounded-t-2xl sm:rounded-2xl p-5 fade">${inner}</div></div>`;
}
function intro() {
  if (!S.intro) return '';
  return `<div class="fixed inset-0 z-[60] flex items-center justify-center p-5"><div class="absolute inset-0 bg-slate-900/60"></div><div class="relative bg-white rounded-2xl p-6 max-w-sm fade">
  <div class="w-14 h-14 rounded-2xl bg-indigo-600 text-white flex items-center justify-center mx-auto mb-3">${I.ball.replace('w-5 h-5', 'w-8 h-8')}</div>
  <h2 class="text-xl font-bold text-center">Klubowicz – demo</h2><p class="text-sm text-slate-600 mt-2 text-center">Tak będzie działać aplikacja klubu na telefonie. Dane są przykładowe – możesz klikać śmiało.</p>
  <ul class="text-sm text-slate-700 mt-4 space-y-2"><li>👤 <b>Zawodnik</b> – zapis na trening, 🚗 / 🍺, saldo, statystyki TOP</li><li>🧑‍🏫 <b>Opiekun</b> – sprawdzanie obecności, cały zespół i stan kont</li><li>👑 <b>Właściciel</b> – członkowie, składki, import przelewów z banku</li></ul>
  <p class="text-xs text-slate-500 mt-3">Rolę zmieniasz przełącznikiem na górze ekranu.</p><button data-a="closeIntro" class="btn w-full mt-4 py-3 bg-indigo-600 text-white">Zaczynamy</button></div></div>`;
}
function render() {
  let body = S.tab === 'stats' ? statsView() : S.tab === 'team' ? teamView() : S.tab === 'finance' ? financeView() : S.tab === 'admin' ? adminView() : S.tid ? trainingView() : trainingsView();
  const t = S.toast;
  $('#app').innerHTML = header() + `<main class="p-4 scroll">${body}</main>` + nav() + modal() + intro() +
    (t ? `<div class="fixed top-28 left-1/2 -translate-x-1/2 z-[70] w-[92%] max-w-[400px] rounded-xl px-4 py-3 text-sm text-white shadow-lg fade ${t.kind === 'err' ? 'bg-red-600' : t.kind === 'info' ? 'bg-slate-800' : 'bg-emerald-600'}">${t.text}</div>` : '');
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  const fn = A[el.dataset.a]; if (!fn) return;
  if (el.tagName !== 'INPUT') e.preventDefault();
  fn(el.dataset); render();
});
seed(); render();
</script>
</body>
</html>
